<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https://molespouzrulyubcfxph.supabase.co; form-action 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>Painel do Bazar — Lizie</title>
  <meta name="description" content="Painel interno da equipe para consultar os agendamentos do Bazar de Fábrica Lizie.">

  <link rel="icon" href="assets/img/favicon.svg?v=4" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/admin.css?v=12">
  <script src="assets/js/admin.js?v=9" defer></script>
</head>
<body class="sem-rolagem">
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
<main id="conteudo" tabindex="-1">
    <!-- ============================= ABERTURA ============================= -->
    <div class="abertura" id="abertura" role="status" aria-label="Carregando painel">
      <svg class="giro" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-opacity=".25"/>
        <path d="M21 12a9 9 0 0 0-9-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- ============================= LOGIN ============================= -->
    <section class="login" id="tela-login" hidden aria-labelledby="titulo-login">
      <form class="login__cartao" id="form-login" novalidate>
        <div class="login__icone" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <rect x="4" y="10" width="16" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M8 10V7.5a4 4 0 0 1 8 0V10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="12" cy="15.5" r="1.4" fill="currentColor"/>
          </svg>
        </div>

        <h1 id="titulo-login">Acesso da equipe</h1>
        <p class="login__texto">Digite a senha para ver os agendamentos.</p>

        <div class="campo">
          <label class="campo__rotulo" for="senha">Senha</label>
          <div class="campo__controle" id="controle-senha">
            <input id="senha" name="senha" type="password" autocomplete="current-password"
                   required aria-describedby="erro-login">
            <button type="button" class="campo__acao" id="mostrar-senha" aria-label="Mostrar senha" aria-pressed="false">
              <svg class="ico-olho" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z" fill="none" stroke="currentColor" stroke-width="1.7"/>
                <circle cx="12" cy="12" r="3.1" fill="none" stroke="currentColor" stroke-width="1.7"/>
              </svg>
              <svg class="ico-olho-cortado" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
                <path d="M2.5 12S6 5.8 12 5.8c1.7 0 3.2.6 4.5 1.4M21.5 12S18 18.2 12 18.2c-1.7 0-3.2-.6-4.5-1.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                <path d="M4 4l16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <p class="campo__erro" id="erro-login" role="alert" hidden></p>
        </div>

        <button type="submit" class="botao-primario" id="entrar">
          <span class="botao-primario__texto">Entrar</span>
          <span class="botao-primario__carregando" aria-hidden="true">
            <svg class="giro" viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-opacity=".25"/>
              <path d="M21 12a9 9 0 0 0-9-9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
            Verificando…
          </span>
        </button>

        <a class="login__voltar" href="index.html">Voltar para o agendamento</a>
      </form>
    </section>

    <!-- ============================= PAINEL ============================= -->
    <section class="painel" id="tela-painel" hidden aria-labelledby="titulo-painel">
      <div class="painel__topo">
        <div class="titulo-grupo">
          <span class="titulo-icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 7.5V12l3 1.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <div>
            <h1 id="titulo-painel">Agendamentos</h1>
            <p class="painel__subtitulo" id="subtitulo">Carregando…</p>
          </div>
        </div>
      </div>

      <div class="busca">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="m15.5 15.5 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <label class="visualmente-oculto" for="busca">Buscar por nome ou telefone</label>
        <input id="busca" type="search" placeholder="Nome ou telefone"
               autocomplete="off" spellcheck="false">
      </div>

      <div class="chips" id="chips" role="group" aria-label="Filtrar por horário"></div>

      <div class="grupos" id="grupos"></div>

      <div class="vazio" id="vazio" hidden>
        <p id="vazio-titulo">Nenhum agendamento.</p>
        <button type="button" class="botao-secundario" id="limpar-filtros" hidden>Limpar busca</button>
      </div>
    </section>
  </main>

  <footer class="rodape">
    <span>Lizie · Painel interno</span>
    <a href="index.html">Página de agendamento</a>
  </footer>

  <dialog class="detalhe" id="detalhe" aria-labelledby="detalhe-nome">
    <div class="detalhe__alca" aria-hidden="true"></div>

    <div class="detalhe__topo">
      <div>
        <h2 id="detalhe-nome"></h2>
        <p class="detalhe__meta" id="detalhe-meta"></p>
      </div>
      <button type="button" class="detalhe__fechar" id="detalhe-fechar" aria-label="Fechar">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <p class="detalhe__hora" id="detalhe-hora"></p>

    <button type="button" class="presenca" id="presenca" aria-pressed="false">
      <span class="presenca__icone" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false">
          <path d="M5 12.5 9.5 17 19 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="presenca__texto" id="presenca-texto">Marcar chegada</span>
    </button>

    <div class="detalhe__rodape" id="detalhe-rodape">
      <button type="button" class="detalhe__excluir" id="excluir">Excluir inscrição</button>
    </div>

    <div class="detalhe__confirmar" id="painel-confirmar-exclusao" hidden>
      <p>Excluir definitivamente a inscrição de <strong id="confirmar-nome"></strong>? Essa ação não pode ser desfeita.</p>
      <div class="detalhe__acoes">
        <button type="button" class="botao-secundario" id="cancelar-exclusao">Cancelar</button>
        <button type="button" class="botao-perigo" id="excluir-confirmar">Excluir</button>
      </div>
    </div>
  </dialog>

  <div class="aviso" id="aviso" role="status" aria-live="polite" hidden></div>

  <noscript>
    <p class="noscript">Ative o JavaScript para usar o painel.</p>
  </noscript>
</body>
</html>
